services:

  # ── Web interface (recommended) ───────────────────────────────────────────
  # Usage: docker compose up -d ui      then open http://localhost:8080
  #
  # Lists the V2 APIs, lets you tick the ones to migrate (or all of them)
  # and runs gravitee_v4_migration.py on the selection.
  #
  # All settings, credentials included, are entered in the Connection page.
  # The only setting outside the UI is the port: UI_PORT in .env (default 8080).
  ui:
    build: .
    image: gravitee-migration:latest
    ports:
      - "${UI_PORT:-8080}:8080"
    environment:
      WEB_PORT: "8080"
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach a Gravitee running on the host (Linux)
    networks:
      - gravitee_net
    restart: unless-stopped

  # ── CLI step 1: generate the input CSV ────────────────────────────────────
  # Usage: docker compose run --rm generate   (asks for the connection settings and credentials)
  generate:
    build: .
    image: gravitee-migration:latest
    command: ["python3", "gravitee_v4_migration.py", "generate"]
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gravitee_net
    profiles: ["cli"]

  # ── CLI step 2: run the migration from ./data/migration_input.csv ─────────
  # Usage: docker compose run --rm migrate    (asks for the connection settings and credentials)
  migrate:
    build: .
    image: gravitee-migration:latest
    command: ["python3", "gravitee_v4_migration.py", "migrate"]
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gravitee_net
    profiles: ["cli"]

networks:
  # Change to "external: true" and set the name if Gravitee is running in
  # its own compose project and you want direct container-to-container access.
  gravitee_net:
    driver: bridge
