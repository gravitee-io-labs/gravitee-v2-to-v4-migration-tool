          <button type="submit" class="btn primary" id="save-btn">${icon.plug.replace('stroke-width="1.8"', 'stroke-width="2.2"')} Save &amp; load APIs</button>
        </div>
      </form>`;
    const form = $("#conn-form");
    $$(".segmented button", form).forEach((b) => b.onclick = () => {
      readForm(); state.conn.auth_mode = b.dataset.mode; renderConnection();
    });
    $("#toggle-token").onclick = () => {
      const i = $("#f-token");
      if (SECRET_TYPE === "text") i.classList.toggle("revealed");
      else i.type = i.type === "password" ? "text" : "password";
    };
    $("#reset-btn").onclick = () => { readForm(); applyDefaults(true); renderConnection(); toast("Defaults restored"); };
    const forget = $("#forget-btn");
    if (forget) forget.onclick = () => {
      state.conn.token = ""; state.conn.username = ""; state.conn.password = "";
      state.apis = []; state.meta = null; state.loaded = false; state.selected.clear();
      state.connStatus = "idle"; state.connError = "";
      updatePill(); renderConnection(); toast("Credentials cleared from this page");
    };
    form.onsubmit = async (e) => {
      e.preventDefault();
      readForm(); persistConn();
      if (!hasCredentials()) {
        state.connStatus = "error";
        state.connError = state.conn.auth_mode === "basic" ? "Enter a username and password." : "Enter a personal access token.";
        updatePill(); renderConnection(); return;
      }
      const btn = $("#save-btn"); btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Connecting…`;
      const ok = await loadApis({ quiet: true });
      if (ok) { toast(`Connected · ${state.apis.length} V2 APIs found`); setView("apis"); }
      else renderConnection();
    };
  }
  function readForm() {
    const v = (id) => ($(id) ? $(id).value : undefined);
    const c = state.conn;
    c.base_url = v("#f-base").trim(); c.org_id = v("#f-org").trim() || "DEFAULT"; c.env_id = v("#f-env").trim() || "DEFAULT";
    if ($("#f-token")) c.token = v("#f-token").trim();
    if ($("#f-user")) c.username = v("#f-user").trim();
    if ($("#f-pass")) c.password = v("#f-pass");
    c.verify_ssl = $("#f-ssl").checked;
    const num = (id, fallback) => { const n = parseInt(v(id), 10); return Number.isFinite(n) ? n : fallback; };
    c.retry_attempts = num("#f-retries", c.retry_attempts);
    c.retry_delay_s = num("#f-delay", c.retry_delay_s);
    c.page_size = num("#f-page", c.page_size);
    state.advancedOpen = $("details.advanced")?.open ?? state.advancedOpen;
  }
  function applyDefaults(force) {
    const d = state.defaults || {};
    const src = force ? {} : saved;
    state.conn.base_url = src.base_url ?? d.base_url ?? "";
    state.conn.org_id = src.org_id ?? d.org_id ?? "DEFAULT";
    state.conn.env_id = src.env_id ?? d.env_id ?? "DEFAULT";
    state.conn.auth_mode = src.auth_mode ?? state.conn.auth_mode ?? "token";
    state.conn.verify_ssl = src.verify_ssl ?? d.verify_ssl ?? true;
    state.conn.retry_attempts = src.retry_attempts ?? d.retry_attempts ?? 3;
    state.conn.retry_delay_s = src.retry_delay_s ?? d.retry_delay_s ?? 2;
    state.conn.page_size = src.page_size ?? d.page_size ?? 100;
    // Credentials typed in the page are kept: resetting only concerns non-secret settings.
    if (force) { store.set("gvm.conn", { auth_mode: state.conn.auth_mode }); for (const k in saved) delete saved[k]; }
  }

  // ---------- runs ----------
  async function loadRuns() {
    try {
      const data = await request("GET", "/api/runs");
      state.runs = data.runs;
      if (data.active_run && data.active_run !== state.activeRun) { state.activeRun = data.active_run; watchActiveRun(); }
      updatePill();
      if (state.view === "runs") renderRuns();
    } catch (e) { toast(e.message); }
  }
  function runOptions(r) {
    // keep_running is absent on runs made before the option existed (then "Start" meant start every API)
    const start = r.auto_start && (r.keep_running ? "Keep running" : "Start");
    return [r.force && "Force", r.auto_deploy && "Deploy", start].filter(Boolean).join(" + ") || "Migrate only";
  }
  function runFailures(r) {
    const s = r.summary;
    return s ? s.migration.failed + s.deploy.failed + s.start.failed : 0;
  }
  function runBadge(status, r) {
    if (status === "completed" && r && r.summary) {
      const total = r.count || r.total || 0;
      if (total && r.summary.migration.success === 0) return `<span class="badge err">Nothing migrated</span>`;
      if (runFailures(r)) return `<span class="badge warn">Completed with errors</span>`;
    }
    return {
      running: `<span class="badge run"><span class="spinner"></span>Running</span>`,
      completed: `<span class="badge ok">Completed</span>`,
      failed: `<span class="badge err">Failed</span>`,
      interrupted: `<span class="badge warn">Interrupted</span>`,
    }[status] || `<span class="badge neutral">${esc(status)}</span>`;
  }
  function renderRuns() {
    const runs = state.runs;
    $("#main").innerHTML = `
      <div class="page-head"><div><h1>Logs</h1><div class="sub">Every migration started from this tool, with the result for each API</div></div>
        <div class="actions">
          <button class="btn" id="runs-refresh">${icon.refresh} Refresh</button>
          <a class="btn" href="/api/audit/logs.txt" ${runs.length ? "" : "hidden"} title="All migration logs in one text file">${icon.download} Export logs</a>
          <a class="btn" href="/api/audit/export.csv" ${runs.length ? "" : "hidden"} title="One row per API per migration: statuses and error messages">${icon.download} Export CSV</a>
        </div></div>
      <div class="card">${!runs.length ? `<div class="empty">${icon.layers}<h3>No migration yet</h3><div>Select APIs in the V2 APIs page and run a migration.</div>
        <button class="btn" id="go-apis">Go to V2 APIs</button></div>` : `
        <div class="table-wrap"><table><thead><tr><th>Started</th><th>Target</th><th>APIs</th><th>Migrated</th><th>Options</th><th>Status</th><th></th></tr></thead>
        <tbody>${runs.map((r) => {
          const s = r.summary;
          return `<tr class="row clickable" data-id="${esc(r.id)}">
            <td><div class="api-name">${esc(fmtDate(r.created_at))}</div><div class="api-desc mono">${esc(r.id)}</div></td>
            <td class="muted">${esc(r.config?.base_url || "")}<div class="api-desc">${esc(r.config?.org_id || "")} / ${esc(r.config?.env_id || "")}</div></td>
            <td>${r.count}</td>
            <td>${s ? `<span style="color:var(--ok);font-weight:600">${s.migration.success}</span>${s.migration.failed ? ` <span class="muted">·</span> <span style="color:var(--err);font-weight:600">${s.migration.failed} failed</span>` : ""}` : "—"}</td>
            <td class="muted">${esc(runOptions(r))}</td>
            <td>${runBadge(r.status, r)}</td>
            <td class="col-dl">${r.status !== "running" ? `<a class="icon-btn row-dl" href="/api/runs/${encodeURIComponent(r.id)}/files/log" title="Download this migration's log" aria-label="Download log">${icon.download}</a>` : ""}</td></tr>`;
        }).join("")}</tbody></table></div>`}
      </div>`;
    $("#runs-refresh").onclick = loadRuns;
    const go = $("#go-apis"); if (go) go.onclick = () => setView("apis");
    $$("tr.row[data-id]").forEach((tr) => tr.onclick = (e) => { if (!e.target.closest(".row-dl")) setView("run", { id: tr.dataset.id }); });
  }

  function stopPolling() { if (state.pollTimer) { clearTimeout(state.pollTimer); state.pollTimer = null; } }
  async function openRun(id) {
    stopPolling();
    state.runId = id; state.run = null; state.runLines = [];
    $("#main").innerHTML = `<div class="page-head"><div><h1>Run</h1><div class="sub">Loading…</div></div></div>`;
    await pollRun();
  }
  async function pollRun() {
    const id = state.runId;
    try {
      const d = await request("GET", `/api/runs/${encodeURIComponent(id)}?since=${state.runLines.length}`);
      if (state.runId !== id || state.view !== "run") return;
      state.runLines.push(...d.lines); state.run = d;
      renderRunDetail();
      if (d.status === "running") { state.pollTimer = setTimeout(pollRun, 700); }
      else if (state.activeRun === id) onRunFinished(id, d);
    } catch (e) {
      if (state.view === "run") $("#main").innerHTML = `<div class="banner err">${icon.alert}<div>${esc(e.message)}</div></div>`;
    }
  }

  // Watches the active run from any page, so the V2 API list is refreshed
  // as soon as a migration ends, whichever page the user is on.
  const finishedRuns = new Set();
  let watchTimer = null;
  function watchActiveRun() {
    if (watchTimer || !state.activeRun) return;
    const tick = async () => {
      watchTimer = null;
      const id = state.activeRun;
      if (!id) return;
      try {
        const cfg = await request("GET", "/api/config");
        if (cfg.active_run === id) {
          if (state.view === "runs") loadRuns();
          watchTimer = setTimeout(tick, 1500);
          return;
        }
        const run = await request("GET", `/api/runs/${encodeURIComponent(id)}?since=999999999`).catch(() => null);
        onRunFinished(id, run);
        if (cfg.active_run) { state.activeRun = cfg.active_run; updatePill(); watchActiveRun(); }
      } catch {
        watchTimer = setTimeout(tick, 3000);
      }
    };
    watchTimer = setTimeout(tick, 1500);
  }
  function onRunFinished(id, run) {
    if (finishedRuns.has(id)) return;
    finishedRuns.add(id);
    if (state.activeRun === id) state.activeRun = null;
    updatePill();
    if (run) {
      const ok = run.summary ? run.summary.migration.success : 0;
      const failed = runFailures(run);
      toast(run.status === "completed"
        ? `Migration finished · ${ok} API${ok === 1 ? "" : "s"} migrated${failed ? ` · ${failed} error${failed === 1 ? "" : "s"}` : ""} · V2 list refreshed`
        : "Migration failed · V2 list refreshed");
    }
    state.selected.clear();
    loadApis({ quiet: true });
    if (state.view === "runs") loadRuns();
  }

  function stepBadge(step, live, isCurrent, enabled) {
    if (!enabled) return `<span class="badge neutral">Off</span>`;
    if (step) {
      const s = step.status;
      if (s === "SUCCESS") return `<span class="badge ok">Success</span>`;
      if (s === "FAILED") return `<span class="badge err">Failed</span>`;
      if (s === "SKIPPED") return `<span class="badge neutral">Skipped</span>`;
      return `<span class="badge neutral">Not run</span>`;
    }
    if (isCurrent) return `<span class="badge run"><span class="spinner"></span>Running</span>`;
    return live ? `<span class="badge neutral">Pending</span>` : `<span class="badge neutral">Not run</span>`;
  }

  function renderRunDetail() {
    const r = state.run;
    const total = r.total || r.count || 0;
    const done = r.status === "running" ? r.progress : total;
    const pct = total ? Math.round((done / total) * 100) : 0;
    const results = r.results;
    const byId = {};
    if (results) results.forEach((x) => (byId[x.api_id] = x));
    const s = r.summary;
    const liveCount = (step, st) => Object.values(r.live || {}).filter((v) => v[step]?.status === st).length;
    const cnt = (step, st) => s ? s[step][st === "SUCCESS" ? "success" : "failed"] : liveCount(step, st);
    const failed = cnt("migration", "FAILED") + cnt("deploy", "FAILED") + cnt("start", "FAILED");

    const rows = r.apis.map((a) => {
      const res = byId[a.id];
      const live = r.live?.[a.id];
      const isCurrent = r.status === "running" && r.current === a.id;
      let mig, dep, sta, errs = [];
      if (res) {
        mig = { status: res.migration_status }; dep = { status: res.deploy_status }; sta = { status: res.start_status };
        [["Migration", res.migration_error], ["Deploy", res.deploy_error], ["Start", res.start_error]].forEach(([k, v]) => v && errs.push([k, v]));
      } else if (live) {
        mig = live.migration; dep = live.deploy; sta = live.start;
        [["Migration", mig], ["Deploy", dep], ["Start", sta]].forEach(([k, v]) => v?.error && errs.push([k, v.error]));
      }
      const pending = r.status === "running";
      const errHtml = errs.map(([k, v]) => `<div class="${/^Skipped/.test(v) ? "skip-text" : "err-text"}">${esc(k)}: ${esc(v)}</div>`).join("");
      return `<tr class="row">
        <td><div class="api-name">${esc(a.name || a.id)}</div><div class="api-desc mono">${esc(a.id)}</div>${errHtml}</td>
        <td>${stepBadge(mig, pending, isCurrent && !mig, true)}</td>
        <td>${stepBadge(dep?.status === "SKIPPED" ? null : dep, pending, isCurrent && mig && !dep, r.auto_deploy)}</td>
        <td>${r.keep_running && a.state && a.state !== "STARTED"
          ? `<span class="badge neutral" title="This API was stopped before migration">Stays stopped</span>`
          : stepBadge(sta?.status === "SKIPPED" ? null : sta, pending, isCurrent && mig && (dep || !r.auto_deploy) && !sta, r.auto_start)}</td>
      </tr>`;
    }).join("");

    const files = r.status !== "running" ? `
      <a class="btn sm" href="/api/runs/${encodeURIComponent(r.id)}/files/log">${icon.download} Download log</a>` : "";

    const consoleEl = $("#console-card");
    const stick = !consoleEl || consoleEl.scrollTop + consoleEl.clientHeight >= consoleEl.scrollHeight - 30;
    const openConsole = $("#console-card") ? !$("#console-card").hidden : r.status !== "completed";

    $("#main").innerHTML = `
      <div class="page-head">
        <div><button class="btn ghost sm" id="back-runs" style="margin:-4px 0 6px -10px">${icon.back} Logs</button>
          <h1 style="display:flex;align-items:center;gap:10px">Migration run ${runBadge(r.status, r)}</h1></div>
        <div class="actions">${files}</div>
      </div>
      ${r.error ? `<div class="banner err">${icon.alert}<div><div class="b-title">Run did not complete</div><div class="b-body">${esc(r.error)}</div></div></div>` : ""}
      <div class="card card-pad">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-weight:600">
          <span>${r.status === "running" ? `Processing ${Math.min(done + 1, total)} of ${total}` : `${total} API${total === 1 ? "" : "s"} processed`}</span><span class="muted">${pct}%</span></div>
        <div class="progress ${r.status === "completed" ? "done" : r.status === "running" ? "" : "failed"}"><div style="width:${pct}%"></div></div>
        <div class="run-meta">
          <span>Target <b>${esc(r.config?.base_url)}</b></span>
          <span>Org / env <b>${esc(r.config?.org_id)} / ${esc(r.config?.env_id)}</b></span>
          <span>Options <b>${esc(runOptions(r))}</b></span>
          <span>Started <b>${esc(fmtDate(r.created_at))}</b></span>
          ${r.finished_at ? `<span>Finished <b>${esc(fmtDate(r.finished_at))}</b></span>` : ""}
        </div>
      </div>
      <div class="stats">
        <div class="stat"><div class="label">Migrated</div><div class="value">${cnt("migration", "SUCCESS")}<small> / ${total}</small></div></div>
        <div class="stat"><div class="label">Deployed</div><div class="value">${r.auto_deploy ? cnt("deploy", "SUCCESS") : "—"}</div></div>
        <div class="stat"><div class="label">${r.keep_running ? "Kept running" : "Started"}</div><div class="value">${r.auto_start ? cnt("start", "SUCCESS") : "—"}</div></div>
        <div class="stat"><div class="label">Failures</div><div class="value ${failed ? "err" : ""}">${failed}</div></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>APIs</h2></div>
        <div class="table-wrap"><table><thead><tr><th>API</th><th>Migration</th><th>Deploy</th><th>Start</th></tr></thead><tbody>${rows}</tbody></table></div>
      </div>
      <div class="card">
        <div class="card-head clickable" id="console-toggle"><h2>Console output</h2><span class="muted" style="font-size:12.5px">${state.runLines.length} lines · ${openConsole ? "Hide" : "Show"}</span></div>
        <pre class="console" id="console-card" ${openConsole ? "" : "hidden"}></pre>
      </div>`;
    const pre = $("#console-card");
    pre.innerHTML = state.runLines.map((l) => {
      const cls = /ERROR|FAILED|❌|Traceback/.test(l) ? "l-err" : /WARNING|⚠️/.test(l) ? "l-warn" : /SUCCESS|✅/.test(l) ? "l-ok" : "";
      return cls ? `<span class="${cls}">${esc(l)}</span>` : esc(l);
    }).join("\n") || '<span style="opacity:.6">Waiting for output…</span>';
    if (stick) pre.scrollTop = pre.scrollHeight;
    $("#console-toggle").onclick = () => { pre.hidden = !pre.hidden; renderRunDetail(); };
    $("#back-runs").onclick = () => setView("runs");
  }

  // ---------- theme ----------
  const themeKey = "gvm.theme";
  const applyTheme = (t) => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
  applyTheme(store.get(themeKey, null));
  $("#theme-btn").onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    applyTheme(next); store.set(themeKey, next);
  };

  // ---------- boot ----------
  (async function boot() {
    try {
      const cfg = await request("GET", "/api/config");
      state.defaults = cfg.defaults; state.activeRun = cfg.active_run;
    } catch { state.defaults = {}; }
    applyDefaults(false);
    updatePill();
    watchActiveRun();
    // Credentials are never stored: every visit starts on the Connection page,
    // unless a migration is running (its progress needs no credentials).
    if (state.activeRun) setView("run", { id: state.activeRun });
    else setView("connection");
  })();
})();
</script>
</body>
</html>
